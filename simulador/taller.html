<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller interactivo CLF-C02</title>
  <script>
    try { if (localStorage.getItem('aws-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
  </script>
  <style>
    :root {
      --navy: #232f3e;
      --orange: #ff9900;
      --page-bg: #f2f3f3;
      --card-bg: #ffffff;
      --text: #16191f;
      --text-muted: #5f6b7a;
      --border: #d5dbdb;
      --soft: #eef1f5;
      --ok-bg: #e6f4ea;
      --ok-border: #2e7d32;
      --bad-bg: #fdecea;
      --bad-border: #c62828;
      --explain-bg: #fff9c4;
      --explain-text: #3e3a00;
      --focus: #0972d3;
      --g0: #0972d3; --g1: #7d4cdb; --g2: #037f51; --g3: #c33d69; --g4: #b45309; --g5: #0e7490;
    }
    [data-theme="dark"] {
      --page-bg: #151c25;
      --card-bg: #1e2838;
      --text: #e8eaed;
      --text-muted: #9aabb8;
      --border: #364858;
      --soft: #283848;
      --ok-bg: #173a26;
      --ok-border: #5fbf6e;
      --bad-bg: #431d1d;
      --bad-border: #ef6b6b;
      --explain-bg: #3a3820;
      --explain-text: #f3eeb0;
      --focus: #5aa9ff;
      --g0: #5aa9ff; --g1: #b18cff; --g2: #4fd1a1; --g3: #ff7aa8; --g4: #f5a54a; --g5: #4fc3dc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Amazon Ember', Arial, sans-serif; background: var(--page-bg); color: var(--text); min-height: 100vh; }
    button { font: inherit; cursor: pointer; color: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    header {
      position: sticky; top: 0; z-index: 10; background: var(--navy); color: #fff;
      display: flex; align-items: center; gap: 0.75rem; padding: 0.65rem 1rem; flex-wrap: wrap;
    }
    .back { color: #aab7b8; text-decoration: none; font-size: 0.85rem; white-space: nowrap; }
    .back:hover { color: var(--orange); }
    .h-title { flex: 1; min-width: 0; font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pts { font-variant-numeric: tabular-nums; font-weight: 700; background: rgba(255,255,255,0.1); padding: 0.25rem 0.6rem; border-radius: 4px; }
    .theme { background: none; border: 1px solid #546e7a; color: #fff; border-radius: 4px; padding: 0.2rem 0.5rem; }
    .progress { height: 4px; background: rgba(0,0,0,0.15); }
    .progress > div { height: 100%; background: var(--orange); width: 0; transition: width 0.3s; }

    main { max-width: 860px; margin: 0 auto; padding: 1.25rem 1rem 6rem; }
    .card { background: var(--card-bg); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 1.25rem; margin-bottom: 1rem; }
    h1 { font-size: 1.3rem; margin-bottom: 0.5rem; }
    h2 { font-size: 1.05rem; margin: 1rem 0 0.5rem; }
    .muted { color: var(--text-muted); font-size: 0.88rem; line-height: 1.6; }
    .kicker { font-size: 0.78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--orange); }
    .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
    .spacer { flex: 1; }
    .btn { border: 1px solid var(--border); background: var(--soft); color: var(--text); padding: 0.55rem 1rem; border-radius: 6px; font-weight: 600; font-size: 0.9rem; text-decoration: none; display: inline-block; }
    .btn:hover { filter: brightness(0.96); }
    .btn.primary { background: var(--orange); border-color: var(--orange); color: #111; }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top: 1px solid var(--border); padding: 0.6rem 1rem; }
    .nav .row { max-width: 860px; margin: 0 auto; }
    .aviso { min-height: 1.4em; margin-top: .6rem; font-size: .88rem; color: var(--text-muted); }

    /* fichas (clasificar, emparejar, ordenar) */
    .chip {
      display: flex; align-items: center; gap: .55rem; width: 100%; text-align: left; border: 1px solid var(--border);
      background: var(--card-bg); border-radius: 8px; padding: .6rem .75rem; line-height: 1.4; font-size: .92rem;
      transition: transform .12s, border-color .12s, box-shadow .12s; touch-action: manipulation;
    }
    .chip:hover { border-color: var(--orange); }
    .chip.sel { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,153,0,.35); transform: translateY(-1px); }
    .chip.ok { background: var(--ok-bg); border-color: var(--ok-border); }
    .chip.bad { background: var(--bad-bg); border-color: var(--bad-border); animation: shake .35s; }
    .chip.dragging { opacity: .4; }
    .chip .why { display: block; font-size: .82rem; color: var(--text-muted); margin-top: .25rem; }
    .chip-body { flex: 1; min-width: 0; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    @keyframes pop { 0% { transform: scale(.96); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
    .pop { animation: pop .3s; }

    .tray { display: flex; flex-direction: column; gap: .55rem; padding: .75rem; border: 2px dashed var(--orange); border-radius: 8px; margin: .8rem 0; }
    .tray:empty { display: none; }
    .tray .chip { font-size: 1rem; }
    .places { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .45rem; }
    .place { text-align: center; }
    .place:hover { border-color: var(--orange); }
    .bucket .chip { font-size: .84rem; padding: .45rem .6rem; }
    .buckets { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .7rem; }
    .bucket { border: 2px solid var(--border); border-radius: 10px; background: var(--soft); padding: .6rem; min-height: 3.5rem; display: flex; flex-direction: column; gap: .45rem; }
    .bucket.over { background: rgba(255,153,0,.12); }
    .bucket-head { font-weight: 700; font-size: .95rem; display: flex; align-items: center; gap: .45rem; padding: .2rem .1rem .3rem; }
    .bucket-head .hint { margin-left: auto; font-size: .78rem; color: var(--text-muted); background: var(--card-bg); border-radius: 10px; padding: 0 .5rem; }
    .bucket-desc { font-size: .8rem; color: var(--text-muted); margin: -.2rem 0 .2rem .1rem; }

    .match { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem 1rem; }
    .match .col { display: flex; flex-direction: column; gap: .5rem; }
    .tag { flex-shrink: 0; min-width: 1.6rem; height: 1.6rem; border-radius: 50%; display: inline-grid; place-items: center; font-size: .78rem; font-weight: 700; color: #fff; background: var(--text-muted); }
    .tag.empty { background: none; border: 2px dashed var(--border); }

    .order { display: flex; flex-direction: column; gap: .5rem; counter-reset: paso; }
    .order .chip { cursor: grab; }
    .num { flex-shrink: 0; width: 1.8rem; height: 1.8rem; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
    .mv { border: 1px solid var(--border); background: var(--soft); border-radius: 6px; width: 2rem; height: 2rem; flex-shrink: 0; }
    .mv:disabled { opacity: .3; }

    /* tarjetas */
    .flip { perspective: 1000px; margin: .8rem 0; }
    .flip-inner { position: relative; min-height: 220px; transition: transform .45s; transform-style: preserve-3d; cursor: pointer; }
    .flip.on .flip-inner { transform: rotateY(180deg); }
    .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; padding: 1.4rem; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: .6rem; }
    .front { background: var(--navy); color: #fff; font-size: 1.25rem; font-weight: 700; }
    .front small { font-size: .78rem; font-weight: 400; color: #aab7b8; }
    .back-face { background: var(--soft); border: 2px solid var(--orange); transform: rotateY(180deg); font-size: 1rem; line-height: 1.55; }

    /* identificar */
    .visual { font-size: 2.6rem; text-align: center; padding: 1rem .5rem; background: var(--soft); border-radius: 12px; margin: .8rem 0; line-height: 1.4; }
    .visual small { display: block; font-size: .9rem; color: var(--text-muted); margin-top: .4rem; }
    .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .5rem; }

    /* íconos de servicios */
    .ico { width: 40px; height: 40px; flex-shrink: 0; border-radius: 6px; }
    .ico-big { width: 96px; height: 96px; }
    .ico-fb { width: 40px; height: 40px; flex-shrink: 0; border-radius: 6px; display: grid; place-items: center; font-size: .62rem; font-weight: 700; color: #fff; background: var(--navy); text-transform: uppercase; text-align: center; line-height: 1.1; padding: 2px; }
    .ico-big.ico-fb { width: 96px; height: 96px; font-size: 1rem; }

    .explain { background: var(--explain-bg); color: var(--explain-text); border-radius: 6px; padding: 0.75rem 0.9rem; font-size: 0.9rem; line-height: 1.55; margin-top: 0.7rem; }
    .score { font-size: 2.4rem; font-weight: 700; color: var(--ok-border); }
    .res { display: flex; justify-content: space-between; gap: .6rem; padding: .45rem 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
    .stars { color: var(--orange); letter-spacing: .1em; }
    .error { border-left: 4px solid var(--bad-border); }

    @media (max-width: 600px) {
      main { padding: 1rem 0.75rem 7rem; }
      .card { padding: 1rem; }
      .match { grid-template-columns: 1fr; }
      .btn { padding: 0.5rem 0.75rem; font-size: 0.85rem; }
      .visual { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <header>
    <a class="back" href="../index.html">← Portal</a>
    <span class="h-title" id="h-title">Taller interactivo</span>
    <span class="pts" id="pts" hidden></span>
    <button class="theme" id="theme" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
  </header>
  <div class="progress"><div id="progress"></div></div>
  <main id="app"><div class="card"><p class="muted">Cargando…</p></div></main>
  <div class="nav" id="nav" hidden></div>
  <script src="taller.js"></script>
</body>
</html>
