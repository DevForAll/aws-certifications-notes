<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal CLF-C02</title>
    <style>
        :root {
            --aws-navy: #232f3e;
            --aws-orange: #ff9900;
            --page-bg: #f2f3f3;
            --card-bg: #ffffff;
            --text-primary: #16191f;
            --text-muted: #666;
            --text-subtle: #888;
            --stats-bg: #1a2433;
            --row-border: #f2f3f3;
            --row-hover: #f8f9f9;
            --btn-notes-bg: #eef1f5;
            --btn-notes-border: #d5dce8;
            --btn-notes-hover: #dde2ea;
            --act-none-color: #ccc;
            --footer-color: #999;
            --soon-header: #546e7a;
            --soon-body-color: #999;
            --module-subtitle: #aab7b8;
        }

        [data-theme="dark"] {
            --page-bg: #151c25;
            --card-bg: #1e2838;
            --text-primary: #e8eaed;
            --text-muted: #9aabb8;
            --text-subtle: #7a8a9a;
            --stats-bg: #0d1420;
            --row-border: #283848;
            --row-hover: #243444;
            --btn-notes-bg: #283848;
            --btn-notes-border: #364858;
            --btn-notes-hover: #324058;
            --act-none-color: #506070;
            --footer-color: #6a7a8a;
            --soon-header: #3a4a56;
            --soon-body-color: #6a7a8a;
            --module-subtitle: #8a9aaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Amazon Ember', Arial, sans-serif;
            background-color: var(--page-bg);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background-color 0.25s, color 0.25s;
        }

        /* ── HEADER ── */
        header {
            background-color: var(--aws-navy);
            color: #fff;
            padding: 2rem 1.5rem 1.5rem;
            text-align: center;
            position: relative;
        }

        .header-badge {
            display: inline-block;
            background: var(--aws-orange);
            color: var(--aws-navy);
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 12px;
            border-radius: 3px;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header h1 { font-size: 1.9rem; font-weight: bold; margin-bottom: 0.4rem; }
        header h1 span { color: var(--aws-orange); }
        header p { color: #aab7b8; font-size: 0.9rem; }

        /* ── STATS BAR ── */
        .stats-bar {
            background: var(--stats-bg);
            padding: 0.65rem 1.5rem;
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            font-size: 0.82rem;
            color: var(--text-subtle);
            flex-wrap: wrap;
            transition: background-color 0.25s;
        }
        .stats-bar strong { color: var(--aws-orange); }

        /* ── MAIN CONTAINER ── */
        .container { max-width: 860px; margin: 2rem auto; padding: 0 1rem; }

        .section-label {
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-subtle);
            margin-bottom: 0.9rem;
            margin-top: 0.5rem;
        }

        /* ── MODULE CARD ── */
        .module-card {
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            margin-bottom: 1.25rem;
            overflow: hidden;
            transition: background-color 0.25s;
        }

        .module-header {
            background: var(--aws-navy);
            color: #fff;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .module-num {
            background: var(--aws-orange);
            color: var(--aws-navy);
            font-weight: bold;
            font-size: 0.78rem;
            padding: 4px 10px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .module-meta { flex: 1; }
        .module-title { font-size: 0.98rem; font-weight: bold; }
        .module-subtitle { font-size: 0.78rem; color: var(--module-subtitle); margin-top: 2px; }

        /* ── LESSON ROW ── */
        .lesson-list { padding: 0.25rem 0; }

        .lesson-row {
            display: flex;
            align-items: center;
            padding: 0.85rem 1.5rem;
            border-bottom: 1px solid var(--row-border);
            gap: 0.9rem;
            transition: background 0.15s;
        }
        .lesson-row:last-child { border-bottom: none; }
        .lesson-row:hover { background-color: var(--row-hover); }

        .lesson-icon {
            width: 36px;
            height: 36px;
            background: var(--page-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            transition: background-color 0.25s;
        }

        .lesson-info { flex: 1; min-width: 0; }

        .lesson-name {
            font-weight: 600;
            font-size: 0.92rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }

        .lesson-desc {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── ACTION BUTTONS ── */
        .item-actions { display: flex; gap: 0.45rem; flex-shrink: 0; }

        .act-notes {
            background: var(--btn-notes-bg);
            color: var(--aws-navy);
            padding: 0.3rem 0.75rem;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid var(--btn-notes-border);
            transition: background 0.15s;
        }
        .act-notes:hover { background: var(--btn-notes-hover); }

        [data-theme="dark"] .act-notes { color: #c8d8e8; }

        .act-eval {
            background: var(--aws-orange);
            color: #111;
            padding: 0.3rem 0.75rem;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            transition: background 0.15s;
        }
        .act-eval:hover { background: #e68a00; }

        .act-none { color: var(--act-none-color); font-size: 0.78rem; padding: 0.3rem 0.5rem; white-space: nowrap; }

        /* ── COMING SOON ── */
        .module-card.soon { opacity: 0.55; }
        .module-card.soon .module-header { background: var(--soon-header); }

        .soon-tag {
            background: rgba(255,255,255,0.15);
            color: #ccc;
            font-size: 0.72rem;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 10px;
            white-space: nowrap;
        }

        .soon-body {
            padding: 0.9rem 1.5rem;
            color: var(--soon-body-color);
            font-size: 0.85rem;
            font-style: italic;
        }

        /* ── THEME TOGGLE ── */
        .theme-toggle {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--aws-orange);
            color: #111;
            border: none;
            cursor: pointer;
            font-size: 1.25rem;
            box-shadow: 0 3px 12px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: transform 0.2s, box-shadow 0.2s;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover { transform: scale(1.1); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--footer-color);
            font-size: 0.78rem;
            line-height: 1.8;
        }
        footer a { color: var(--aws-orange); text-decoration: none; }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            header h1 { font-size: 1.5rem; }
            header { padding: 1.5rem 1rem 1.25rem; }
            .stats-bar { gap: 1.2rem; }
            .module-header { padding: 0.85rem 1rem; }
            .lesson-row { padding: 0.75rem 1rem; gap: 0.6rem; }
            .lesson-icon { width: 30px; height: 30px; font-size: 0.85rem; }
            .lesson-desc { display: none; }
            .act-notes, .act-eval { font-size: 0.75rem; padding: 0.28rem 0.55rem; }
            .act-none { display: none; }
            .theme-toggle { width: 42px; height: 42px; font-size: 1.1rem; bottom: 1rem; right: 1rem; }
        }

        /* ── PORTAL DINÁMICO ── */
        .act-practice {
            background: var(--aws-orange); color: #111; padding: 0.3rem 0.75rem; border-radius: 5px;
            text-decoration: none; font-size: 0.8rem; font-weight: 700; white-space: nowrap;
        }
        .act-practice:hover { background: #e68a00; }
        .act-old {
            color: var(--text-muted); padding: 0.3rem 0.6rem; border-radius: 5px; text-decoration: none;
            font-size: 0.75rem; white-space: nowrap; border: 1px dashed var(--btn-notes-border);
        }
        .act-old:hover { color: var(--text-primary); }
        .chip { font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.55rem; border-radius: 10px; text-decoration: none; white-space: nowrap; }
        .chip.pass { background: #e6f4ea; color: #2e7d32; }
        .chip.fail { background: #fdecea; color: #c62828; }
        [data-theme="dark"] .chip.pass { background: #173a26; color: #7fd88c; }
        [data-theme="dark"] .chip.fail { background: #431d1d; color: #ff9a9a; }
        .history { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .history td { padding: 0.6rem 1.5rem; border-bottom: 1px solid var(--row-border); }
        .history td:last-child { text-align: right; }
        .history tr:last-child td { border-bottom: none; }
        .empty { padding: 0.9rem 1.5rem; color: var(--text-muted); font-size: 0.85rem; }
        @media (max-width: 600px) {
            .act-practice, .act-old { font-size: 0.75rem; padding: 0.28rem 0.5rem; }
            .act-old { display: none; }
            .lesson-name { white-space: normal; font-size: 0.85rem; }
            .item-actions { flex-wrap: wrap; justify-content: flex-end; }
            .history td { padding: 0.55rem 1rem; }
            .history .h-mode { display: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-badge">Portal de Estudio</div>
    <h1>AWS <span>Cloud Practitioner</span></h1>
    <p>CLF-C02 &nbsp;·&nbsp; Notas, prácticas tipo examen y resultados por lección</p>
</header>

<div class="stats-bar" id="stats"></div>

<div class="container" id="app"></div>

<footer>
    <p>AWS Certified Cloud Practitioner (CLF-C02) · Notas de estudio personales</p>
    <p id="generado"></p>
    <p><a href="https://github.com/DevForAll/aws-certifications-notes" target="_blank" rel="noopener">Ver en GitHub</a></p>
</footer>

<button id="theme-toggle" class="theme-toggle" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>

<script src="contenido.js"></script>
<script>
    (function () {
        var btn = document.getElementById('theme-toggle');
        var html = document.documentElement;
        function pintarTema() { btn.textContent = html.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙'; }
        try { if (localStorage.getItem('aws-theme') === 'dark') html.setAttribute('data-theme', 'dark'); } catch (e) {}
        pintarTema();
        btn.addEventListener('click', function () {
            var dark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', dark ? 'light' : 'dark');
            try { localStorage.setItem('aws-theme', dark ? 'light' : 'dark'); } catch (e) {}
            pintarTema();
        });
    })();

    (function () {
        var C = window.CONTENIDO;
        var app = document.getElementById('app');
        if (!C) {
            app.innerHTML = '<p class="empty">Falta <code>contenido.js</code>. Corre <code>python actualizar-indice.py</code>.</p>';
            return;
        }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
        function archivo(ruta) { return ruta.split('/').map(encodeURIComponent).join('/'); }
        function nota(ruta) { return 'visor/index.html?nota=' + encodeURIComponent(ruta); }
        function practicar(ruta) { return 'simulador/index.html?banco=' + encodeURIComponent('../' + ruta); }
        var porId = {};
        C.resultados.forEach(function (r) { porId[r.id] = r; });
        function revisar(r) { return practicar(r.banco) + '&resultado=' + encodeURIComponent(r.id); }
        function chip(ids) {
            var r = ids && ids.length ? porId[ids[0]] : null;
            if (!r) return '';
            return '<a class="chip ' + (r.porcentaje >= r.umbral ? 'pass' : 'fail') + '" href="' + revisar(r) +
                '" title="Último intento: ' + esc(r.fecha.replace('T', ' ')) + '">' + r.porcentaje + ' %</a>';
        }
        function acciones(x) {
            var h = '';
            if (x.nota) h += '<a href="' + nota(x.nota) + '" class="act-notes">Notas</a>';
            if (x.practica) h += '<a href="' + practicar(x.practica.ruta) + '" class="act-practice" title="' + x.practica.n + ' preguntas">Practicar</a>';
            x.evalAntigua.forEach(function (e, i) {
                var etiqueta = x.evalAntigua.length > 1 ? 'Eval antigua ' + (i + 1) : 'Eval antigua';
                h += '<a href="' + (e.tipo === 'md' ? nota(e.ruta) : archivo(e.ruta)) + '" class="act-old">' + etiqueta + '</a>';
            });
            return h || '<span class="act-none">—</span>';
        }
        function fila(icono, nombre, desc, x) {
            return '<div class="lesson-row"><div class="lesson-icon">' + icono + '</div><div class="lesson-info">' +
                '<div class="lesson-name">' + esc(nombre) + '</div>' + (desc ? '<div class="lesson-desc">' + esc(desc) + '</div>' : '') +
                '</div><div class="item-actions">' + chip(x.resultados) + acciones(x) + '</div></div>';
        }

        var nNotas = 0, nPract = 0, activos = 0, h = '<p class="section-label">Módulos</p>';
        C.modulos.forEach(function (m) {
            if (!m.lecciones.length && !m.simulacro) {
                h += '<div class="module-card soon"><div class="module-header"><span class="module-num">MÓDULO ' + m.num + '</span>' +
                    '<div class="module-meta"><div class="module-title">' + esc(m.titulo) + '</div><div class="module-subtitle">' + esc(m.temas) + '</div></div>' +
                    '<span class="soon-tag">Próximamente</span></div></div>';
                return;
            }
            activos++;
            var notas = m.lecciones.filter(function (l) { return l.nota; }).length;
            var pract = m.lecciones.filter(function (l) { return l.practica; }).length + (m.simulacro ? 1 : 0);
            nNotas += notas; nPract += pract;
            h += '<div class="module-card"><div class="module-header"><span class="module-num">MÓDULO ' + m.num + '</span>' +
                '<div class="module-meta"><div class="module-title">' + esc(m.titulo) + '</div><div class="module-subtitle">' +
                notas + ' notas · ' + pract + ' prácticas · ' + esc(m.temas) + '</div></div></div><div class="lesson-list">';
            m.lecciones.forEach(function (l) {
                h += fila(l.nota ? '📖' : '📝', 'Lección ' + l.num + ' — ' + l.titulo, l.desc, l);
            });
            if (m.simulacro) {
                h += fila('🎯', 'Simulacro del módulo ' + m.num, m.simulacro.n + ' preguntas en modo examen',
                    { nota: null, practica: m.simulacro, evalAntigua: [], resultados: m.simulacro.resultados });
            }
            h += '</div></div>';
        });

        if (C.repaso.length) {
            h += '<p class="section-label" style="margin-top:2rem">Repaso general</p><div class="module-card"><div class="module-header">' +
                '<span class="module-num">REPASO</span><div class="module-meta"><div class="module-title">Resúmenes y simulacros completos</div>' +
                '<div class="module-subtitle">Simulacros de 65 preguntas tras M5, tras M11 y en la Fase 3</div></div></div><div class="lesson-list">';
            C.repaso.forEach(function (x) {
                nPract += x.practica ? 1 : 0;
                h += fila(x.practica ? '🎯' : '📚', x.titulo, x.practica ? x.practica.n + ' preguntas' : '', x);
            });
            h += '</div></div>';
        }

        h += '<p class="section-label" style="margin-top:2rem">Historial de resultados</p><div class="module-card">';
        if (C.resultados.length) {
            h += '<table class="history">';
            C.resultados.forEach(function (r) {
                h += '<tr><td>' + esc(r.fecha.slice(0, 10)) + '</td><td>' + esc(r.titulo) + '</td><td class="h-mode">' + esc(r.modo) + '</td>' +
                    '<td><a class="chip ' + (r.porcentaje >= r.umbral ? 'pass' : 'fail') + '" href="' + revisar(r) + '">' + r.porcentaje + ' % · Revisar</a></td></tr>';
            });
            h += '</table>';
        } else {
            h += '<p class="empty">Todavía no hay intentos registrados. Cada práctica guardada aparece aquí y se puede revisar desde cualquier dispositivo.</p>';
        }
        h += '</div>';
        app.innerHTML = h;

        var stats = '<span><strong>' + nNotas + '</strong> notas de lección</span><span><strong>' + nPract + '</strong> prácticas</span>' +
            '<span><strong>' + C.resultados.length + '</strong> intentos</span><span><strong>' + activos + ' / ' + C.modulos.length + '</strong> módulos</span>';
        if (C.examen && C.examen.fecha) {
            var p = C.examen.fecha.split('-'), examen = new Date(+p[0], +p[1] - 1, +p[2]), hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            var dias = Math.round((examen - hoy) / 86400000);
            var meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
            stats += '<span>Examen: <strong>' + (+p[2]) + ' ' + meses[+p[1] - 1] + ' ' + p[0] + '</strong>' + (dias >= 0 ? ' · faltan ' + dias + ' días' : '') + '</span>';
        }
        document.getElementById('stats').innerHTML = stats;
        document.getElementById('generado').textContent = 'Índice actualizado: ' + C.generado;
    })();
</script>

</body>
</html>
